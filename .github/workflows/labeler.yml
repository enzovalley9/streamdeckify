name: Label pull requests

# pull_request_target so it can label pull requests from forks. It never checks
# out or runs their code: it only reads which paths changed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
