name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and check content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Ground rules in the prompts, nothing private, no stray dashes.
      - run: npm run check
      # Fails if any device or deck has a wrong or missing field.
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
